name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.osf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        osf: [ alpine, ubuntu ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image
        run: docker build -t satishweb/doh-server:ci -f Dockerfile.${{ matrix.osf }} .

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests docker

      - name: Run tests
        run: python ./tests/test-doh-server.py --image satishweb/doh-server:ci

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3

      - name: Lint chart
        run: helm lint helm/doh-server

      - name: Render chart
        run: |
          helm template doh-server helm/doh-server > /dev/null
          helm template doh-server helm/doh-server --set ingress.enabled=true > /dev/null

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@v0.10.0
        with:
          scandir: .
          additional_files: 'docker-entrypoint build.sh app-config-example'
          exclude: SC1091
