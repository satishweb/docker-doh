name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.osf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        osf: [ alpine, ubuntu ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image
        run: docker build -t satishweb/doh-server:ci-${{ matrix.osf }} -f Dockerfile.${{ matrix.osf }} .

      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/doh-server:ci-${{ matrix.osf }}
          format: table
          output: /tmp/trivy-${{ matrix.osf }}.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy-${{ matrix.osf }}.txt

      - name: Generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/doh-server:ci-${{ matrix.osf }}
          format: cyclonedx
          output: /tmp/sbom-${{ matrix.osf }}.cdx.json

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.osf }}
          path: /tmp/sbom-${{ matrix.osf }}.cdx.json
          if-no-files-found: error

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run tests
        run: python ./tests/test-doh-server.py --image satishweb/doh-server:ci-${{ matrix.osf }}

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Lint chart
        run: helm lint helm/doh-server

      - name: Render chart
        run: |
          helm template doh-server helm/doh-server > /dev/null
          helm template doh-server helm/doh-server --set ingress.enabled=true > /dev/null

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review the dependencies of the pull request
        uses: actions/dependency-review-action@v4

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          set -euo pipefail
          version=0.11.0
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSL -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${archive}" \
            | sha256sum --check
          tar -xf "${archive}"
          echo "SHELLCHECK_BIN=${PWD}/shellcheck-v${version}" >> "${GITHUB_ENV}"

      - name: Run shellcheck
        run: |
          "${SHELLCHECK_BIN}/shellcheck" --version
          "${SHELLCHECK_BIN}/shellcheck" -x \
            docker-entrypoint \
            build.sh \
            app-config-example \
            examples/docker-compose-doh-server/launch.sh \
            examples/docker-compose-doh-server/remove.sh
