# Build and publish the container images for a release tag.
#
# The tag has to have the form v<version>[-<number>]-<alpine|ubuntu>, for
# example v2.3.10-4-alpine.  The version is the version of the upstream
# dns-over-https release that is built into the image, the optional number
# counts the rebuilds of the same upstream version.
#
# Every tag builds one image, the alpine image additionally gets the "latest"
# tag.  The images are published to the Docker Hub and to the GitHub
# container registry.
#
# The workflow can be started by hand with a dry run, that builds the images
# without publishing them.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, for example v2.3.10-4-alpine"
        required: true
        type: string
      dry_run:
        description: "Build the images without publishing them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: doh-server
  DOCKERHUB_OWNER: satishweb

jobs:
  build:
    name: Build ${{ matrix.osf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - osf: alpine
            dockerfile: Dockerfile.alpine
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/ppc64le,linux/s390x,linux/386
          - osf: ubuntu
            dockerfile: Dockerfile.ubuntu
            platforms: linux/amd64,linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?-(alpine|ubuntu)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>[-<number>]-<alpine|ubuntu>."
            exit 1
          fi
          version="v${BASH_REMATCH[1]}"
          osf="${BASH_REMATCH[3]}"
          echo "The upstream version is ${version} and the image is built for ${osf}."

          {
            echo "version=${version}"
            echo "osf=${osf}"
            echo "tags<<EOF"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${osf}"
            if [ "${osf}" = "alpine" ]; then
              echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:latest"
            fi
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${osf}"
            if [ "${osf}" = "alpine" ]; then
              echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Docker Hub
        if: steps.release.outputs.osf == matrix.osf && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry
        if: steps.release.outputs.osf == matrix.osf && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: steps.release.outputs.osf == matrix.osf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            DOH_VERSION=${{ steps.release.outputs.version }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.release.outputs.tags }}
          provenance: true
          labels: |
            org.opencontainers.image.title=DNS Over HTTP Server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "The release ${TAG} exists already, its notes are updated."
            gh release edit "${TAG}" --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
