# Build and publish the container images for a release tag.
#
# The tag has to have the form v<version>[-<number>]-<alpine|ubuntu>, for
# example v2.3.10-4-alpine.  The version is the version of the upstream
# dns-over-https release that is built into the image, the optional number
# counts the rebuilds of the same upstream version.
#
# Every tag builds one image, the alpine image additionally gets the "latest"
# tag.  The images are published to the Docker Hub and to the GitHub
# container registry.
#
# The workflow can be started by hand with a dry run, that builds the images
# without publishing them.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, for example v2.3.10-4-alpine"
        required: true
        type: string
      dry_run:
        description: "Build the images without publishing them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: doh-server
  DOCKERHUB_OWNER: satishweb

jobs:
  gate:
    name: Check the build of the branch
    runs-on: ubuntu-latest
    steps:
      - name: The CI workflow has to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for a successful CI run for ${COMMIT}."
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&status=completed&per_page=20" \
            --jq '[.workflow_runs[].conclusion] | if index("success") then "success" else "none" end')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::The CI workflow did not pass for ${COMMIT}. A release can only be cut from a commit that was built and tested on the branch."
            exit 1
          fi
          echo "The CI workflow passed for ${COMMIT}."

  verify:
    name: Verify the ${{ matrix.osf }} image
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - osf: alpine
            dockerfile: Dockerfile.alpine
          - osf: ubuntu
            dockerfile: Dockerfile.ubuntu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?-(alpine|ubuntu)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>[-<number>]-<alpine|ubuntu>."
            exit 1
          fi
          echo "version=v${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
          echo "osf=${BASH_REMATCH[3]}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The image is built for the platform of the runner, that is enough
          # to test it. The image for all the platforms is built by the
          # publish job.
          platforms: linux/amd64
          build-args: |
            DOH_VERSION=${{ steps.release.outputs.version }}
          load: true
          tags: doh-server:verify
          provenance: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: doh-server:verify
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: doh-server:verify
          format: cyclonedx
          output: /tmp/sbom.cdx.json

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /tmp/sbom.cdx.json
          if-no-files-found: error

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Test the image
        run: |
          python ./tests/test-doh-server.py --image doh-server:verify --port 8053

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - osf: alpine
            dockerfile: Dockerfile.alpine
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/ppc64le,linux/s390x,linux/386
          - osf: ubuntu
            dockerfile: Dockerfile.ubuntu
            platforms: linux/amd64,linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?-(alpine|ubuntu)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>[-<number>]-<alpine|ubuntu>."
            exit 1
          fi
          version="v${BASH_REMATCH[1]}"
          osf="${BASH_REMATCH[3]}"
          echo "The upstream version is ${version} and the image is built for ${osf}."

          {
            echo "version=${version}"
            echo "osf=${osf}"
            echo "tags<<EOF"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${osf}"
            if [ "${osf}" = "alpine" ]; then
              echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:latest"
            fi
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${osf}"
            if [ "${osf}" = "alpine" ]; then
              echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Docker Hub
        if: steps.release.outputs.osf == matrix.osf && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry
        if: steps.release.outputs.osf == matrix.osf && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: steps.release.outputs.osf == matrix.osf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            DOH_VERSION=${{ steps.release.outputs.version }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.release.outputs.tags }}
          # A provenance attestation is published as an extra manifest of
          # the platform unknown/unknown, that is listed on the Docker Hub
          # next to the images of the real platforms.
          provenance: false
          labels: |
            org.opencontainers.image.title=DNS Over HTTP Server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

  scan-platforms:
    name: Scan the published image
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - osf: alpine
            platform: linux/amd64
          - osf: alpine
            platform: linux/arm64
          - osf: alpine
            platform: linux/arm/v7
          - osf: alpine
            platform: linux/arm/v6
          - osf: alpine
            platform: linux/ppc64le
          - osf: alpine
            platform: linux/s390x
          - osf: alpine
            platform: linux/386
          - osf: ubuntu
            platform: linux/amd64
          - osf: ubuntu
            platform: linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull the image of the platform
        run: |
          docker pull --platform ${{ matrix.platform }} \
            satishweb/doh-server:${{ inputs.tag || github.ref_name }}

      - name: Scan the image of the platform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/doh-server:${{ inputs.tag || github.ref_name }}
          format: table
          output: /tmp/trivy-${{ matrix.osf }}-${{ matrix.platform }}.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the platform
        if: always()
        run: cat /tmp/trivy-${{ matrix.osf }}-${{ matrix.platform }}.txt

  release:
    name: GitHub release
    needs: scan-platforms
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "The release ${TAG} exists already, its notes are updated."
            gh release edit "${TAG}" --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
