# Default values for doh-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: satishweb/doh-server
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Annotations for the deployment
deploymentAnnotations: {}

env:
  DEBUG: "0"
  UPSTREAM_DNS_SERVER: "udp:8.8.8.8:53"
  DOH_HTTP_PREFIX: "/dns-query"
  # Additional paths the resolve endpoint is served on (comma separated).
  DOH_HTTP_PREFIXES: "/getnsrecord"
  DOH_SERVER_LISTEN: ":8053"
  DOH_SERVER_TIMEOUT: "10"
  DOH_SERVER_TRIES: "3"
  DOH_SERVER_VERBOSE: "false"
  DOH_SERVER_LOG_GUESSED_CLIENT_IP: "false"
  DOH_SERVER_ECS_ALLOW_NON_GLOBAL_IP: "false"
  DOH_SERVER_ECS_USE_PRECISE_IP: "false"
  # Local address and port that is used for the queries to the upstream
  # resolver. Empty lets the server choose one.
  DOH_SERVER_LOCAL_ADDR: ""
  # The TLS certificate and the key of the server. They have to be set
  # together and the files have to be readable inside the container.
  DOH_SERVER_CERT: ""
  DOH_SERVER_KEY: ""
  # Require the clients to present a certificate.
  DOH_SERVER_TLS_CLIENT_AUTH: "false"
  DOH_SERVER_TLS_CLIENT_AUTH_CA: ""

containerPort: 8053

service:
  type: ClusterIP
  port: 80
  annotations:

ingress:
  enabled: false
  className: nginx
  domainName: "doh.your-domain.com"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  pathType: Prefix
  # Nginx specific annotations. They are only applied when className is nginx.
  nginxAnnotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "86400"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST"
    nginx.ingress.kubernetes.io/auth-cache-key: "$scheme$proxy_host$uri$is_args$args$request_body"
    nginx.ingress.kubernetes.io/auth-cache-duration: "any 10m"

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
   limits:
     cpu: 100m
     memory: 128Mi
   requests:
     cpu: 100m
     memory: 128Mi

# Query used by the liveness and readiness probes.
probesQuery: name=google.com&type=A
# Path used by the liveness and readiness probes.
# Defaults to env.DOH_HTTP_PREFIX when left empty.
probesPath: ""
# Scheme of the liveness and readiness probes. It has to be HTTPS when the
# server runs with TLS, that is when env.DOH_SERVER_CERT and
# env.DOH_SERVER_KEY are set.
probesScheme: HTTP

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}
